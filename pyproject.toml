[project]
name = "trossen-vla-bridge"
version = "0.1.0"
description = "Bridge between fine-tuned VLAs (OpenVLA, OpenVLA-OFT, pi0) and a Trossen AI Solo arm via the openpi-client websocket protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "UoA Trossen Arm" }]
keywords = ["vla", "robotics", "trossen", "openvla", "openpi", "pi0"]

# Minimal runtime: just enough to import the protocol library + run mock_client.
# Per-role heavy deps (torch, transformers, lerobot, etc.) live in the setup
# scripts under ./scripts because each VLA needs its own dedicated venv to
# avoid dependency conflicts.
dependencies = [
    "numpy>=1.22,<2.0",
    "openpi-client",
    "websockets>=15",
    "msgpack>=1.0",
    "msgpack-numpy>=0.4.8",
]

[project.scripts]
trossen-mock-client = "trossen_vla_bridge.mock_client:main"
trossen-client      = "trossen_vla_bridge.client_trossen_solo:main"
trossen-serve-openvla = "trossen_vla_bridge.serve_openvla:main"
trossen-serve-oft     = "trossen_vla_bridge.serve_oft:main"
trossen-serve-pi0     = "trossen_vla_bridge.serve_pi0:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trossen_vla_bridge"]

[tool.uv.sources]
openpi-client = { path = "./packages/openpi-client" }
